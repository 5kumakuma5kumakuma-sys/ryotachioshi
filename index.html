<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>限界オタク管理局</title><style>*{box-sizing:border-box}body{margin:0;background:#0a1018;color:#e8f4f5;font:16px/1.7 system-ui,sans-serif}main{max-width:540px;margin:auto;padding:24px 18px}header{display:flex;justify-content:space-between;color:#73e6c8;font-size:11px;letter-spacing:2px}h1{font-size:32px;line-height:1.3;margin:12px 0}small{color:#9aadb9}.panel{border:1px solid #31504e;background:#111e28;border-radius:12px;padding:22px;margin:20px 0;min-height:180px}#tag{color:#73e6c8;font-size:12px;letter-spacing:2px}#headline{font-size:26px;line-height:1.4;margin:12px 0;white-space:pre-line}#detail{white-space:pre-line}button{font:inherit;color:inherit;background:#162631;border:1px solid #39545e;border-radius:9px;padding:14px;cursor:pointer;text-align:left}button:active{background:#31504e}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid button small{display:block}.primary{width:100%;text-align:center;background:#73e6c8;color:#09221c;font-weight:bold;margin:10px 0}.rare{border-color:#eac36c;box-shadow:0 0 24px #eac36c44}footer{text-align:center;margin-top:30px;color:#9aadb9;font-size:11px}label{display:block;margin:12px 0}input{accent-color:#73e6c8}#logo{background:none;border:0;padding:0;color:#73e6c8;font-size:11px;letter-spacing:2px}a{color:#73e6c8}</style></head><body><main><header><button id="logo" aria-label="管理局ロゴ">OTAKU CONTROL BUREAU</button><span>● ONLINE</span></header><small>非公式 / ENTERTAINMENT SYSTEM</small><h1>限界オタク管理局</h1><small>あなたは読み取ってはいけない背中を読み取りました。</small><section class="panel" id="panel" aria-live="polite"><div id="tag"></div><h2 id="headline"></h2><div id="detail"></div><div id="extra"></div></section><button class="primary" onclick="randomPage()">再スキャンする ↻</button><div class="grid"><button onclick="show('manual')">取扱説明書<small>01 / MANUAL</small></button><button onclick="show('error')">障害情報<small>02 / ERROR</small></button><button onclick="fortune()">推し活おみくじ<small>03 / FORTUNE</small></button><button onclick="gacha()">無料推しガチャ<small>04 / GACHA</small></button><button onclick="quiz()">限界度診断<small>05 / CHECK</small></button><button onclick="show('secret')">極秘資料<small>06 / CLASSIFIED</small></button></div><footer>架空の管理局です。実在する団体とは関係ありません。<br>課金・個人情報の収集はありません。</footer></main><script>
const pages={manual:['MANUAL','オタク取扱説明書','動力源：推しからのレス\n充電方法：特典会\n故障原因：落選・推し不足\n注意：推しの前では語彙力が低下します。'],error:['ERROR 404','理性が見つかりません。','原因：推しが可愛すぎるため。\n金銭感覚：応答なし\n推しへの愛：正常稼働中\n復旧の予定はありません。'],secret:['CLASSIFIED','機密情報：労働の目的','一般人：生活のため\n当該オタク：次の現場のため\nなお、本人はこれを経済活動と主張しています。'],welcome:['SCAN COMPLETE','俺の背中より、推しを見ろ。','わざわざ読み取ってくれてありがとう。\nせっかくなので遊んでいってください。'],rare:['SSR / 1%','あなたは選ばれしオタクです。','本日の運をここで使い切りました。\n次の現場で良いことがありますように。'],hidden:['ACCESS GRANTED','裏管理局へようこそ。','ロゴを連打するとは、相当な暇人……ではなく、優秀な調査員ですね。']};
function render(tag,head,detail,rare=false){document.getElementById('tag').textContent=tag;document.getElementById('headline').textContent=head;document.getElementById('detail').textContent=detail;document.getElementById('extra').replaceChildren();document.getElementById('panel').classList.toggle('rare',rare)}function show(k){render(...pages[k],k==='rare'||k==='hidden')}function pick(a){return a[Math.floor(Math.random()*a.length)]}function randomPage(){let r=Math.random();if(r<.01)show('rare');else if(r<.10)render('RARE / 9%','推しからのレスを検知。','※検知したのはあなたの希望的観測です。',true);else show(pick(['manual','error','secret','welcome']))}function fortune(){let a=pick([['大吉','推しと目が合う予感。'],['中吉','チェキのポーズがすぐ決まる。'],['小吉','物販列が思ったより短い。'],['凶','財布の中身を確認せよ。'],['推吉','推しが今日も可愛い。それだけで勝ち。']]);render('FORTUNE',a[0],a[1])}function gacha(){let r=Math.random(),rank=r<.01?'SSR':r<.10?'SR':r<.35?'R':'N';render('FREE GACHA',rank,pick(['推しの笑顔を脳内再生する権利','今日も推しを応援する権利','次の現場を楽しみにする権利']),rank==='SSR')}function quiz(){render('CHECK','限界オタク適性診断','当てはまる項目を選択してください。');let e=document.getElementById('extra');['推しのために遠征した','チェキ代の計算をやめた','推しの通知をONにしている','翌日仕事でも現場に行く','推しのためなら節約できる'].forEach(q=>{let l=document.createElement('label'),i=document.createElement('input');i.type='checkbox';l.append(i,' '+q);e.append(l)});let b=document.createElement('button');b.textContent='診断結果を見る';b.onclick=()=>{let n=e.querySelectorAll('input:checked').length;render('RESULT','限界度 '+n*20+'%', ['まだ引き返せます。','沼の入口です。','順調に沼へ。','手遅れが近い。','こちら側の人間ですね。','おめでとうございます。手遅れです。'][n])};e.append(b)}let taps=0;document.getElementById('logo').onclick=()=>{if(++taps===5){show('hidden');taps=0}};randomPage();</script></body></html>
